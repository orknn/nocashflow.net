<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Unsubscribed — NoCashFlow</title>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#ECEAE3"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  /* Liquid (LIQUID-REDESIGN-PLAN.md, Faz 5) — standalone: this page loads no site CSS */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #ECEAE3; color: #0B0C0F;
    font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 6px; -webkit-font-smoothing: antialiased;
  }
  body::before {            /* the mood glow from the home stage, quietly */
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(60% 50% at 50% 0%, rgba(255,75,38,.10), transparent 70%);
  }
  .logo {
    font-weight: 600; font-size: 17px; letter-spacing: -0.03em;
    padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,.5);
    border: 1px solid rgba(11,12,15,.14); margin-bottom: 40px;
  }
  .logo .slash { color: #FF4B26; }
  .kicker {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: #FF4B26; margin-bottom: 18px;
  }
  .head {
    font-weight: 400;
    font-size: clamp(2.6rem, 9vw, 6.4rem); line-height: .9; letter-spacing: -0.055em;
    animation: rise 1.1s cubic-bezier(.19,1,.22,1) both;
  }
  .msg { font-size: clamp(1.05rem, 3vw, 1.3rem); line-height: 1.4; color: #0B0C0F; margin-top: 22px; max-width: 34ch; }
  .msg .tr, .msg .en {
    display: block; color: #6E6C66; margin-top: 10px;
    font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 1.12em; line-height: 1.2;
  }
  .actions { display: flex; gap: 8px; margin-top: 38px; flex-wrap: wrap; justify-content: center; }
  .btn {
    position: relative; overflow: hidden; isolation: isolate;
    font: 500 15px 'Bricolage Grotesque', ui-sans-serif, sans-serif;
    color: #ECEAE3; background: #0B0C0F; text-decoration: none;
    border-radius: 999px; padding: 12px 24px; transition: color .3s;
  }
  .btn + .btn { background: none; color: #0B0C0F; box-shadow: inset 0 0 0 1px rgba(11,12,15,.3); }
  .btn::before {
    content: ""; position: absolute; left: 50%; top: 50%; z-index: -1; width: 140%; aspect-ratio: 1; border-radius: 50%;
    background: #FF4B26; transform: translate(-50%,-50%) scale(0); transition: transform .6s cubic-bezier(.19,1,.22,1);
  }
  .btn:hover::before { transform: translate(-50%,-50%) scale(1); }
  .btn:hover { color: #0B0C0F; }
  :focus-visible { outline: 2px solid #FF4B26; outline-offset: 3px; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  @media (prefers-reduced-motion: reduce) { .head { animation: none; } .btn::before { transition: none; } }
</style>
</head>
<body>
  <div class="logo">NO<span class="slash">/</span>CASHFLOW</div>
  <div class="kicker">The Bulletin</div>
  <h1 class="head">You've unsubscribed.</h1>
  <p class="msg">You won't receive the bulletin anymore. Changed your mind? Resubscribe any time from the homepage.<span class="tr">Artık bülteni almayacaksın. Fikrini değiştirirsen ana sayfadan tekrar abone olabilirsin.</span></p>
  <div class="actions">
    <a class="btn" href="/">Home</a>
    <a class="btn" href="/tr/">Türkçe</a>
  </div>
</body>
</html>
